<!DOCTYPE html>
<html>
<head>
    <title>Suffix to Scientific e Notation</title>

    <!-- Comic Neue Angular Font -->
    <style>
        @font-face {
            font-family: "ComicNeue";
            src: url("fonts/ComicNeue-Angular-Regular.ttf") format("truetype");
        }

        body {
            font-family: "ComicNeue", monospace;
            background: linear-gradient(135deg,#1e1e2f,#2b2b40);
            color: white;
            padding: 40px;
            text-align: center;
        }

        h1 {
            font-size: 34px;
            margin-bottom: 25px;
        }

        textarea {
            width: 95%;
            height: 90px;
            font-size: 20px;
            padding: 15px;
            border-radius: 12px;
            border: none;
            background: #111;
            color: #00ffcc;
        }

        #output {
            margin-top: 25px;
            font-size: 24px;
            font-weight: bold;
            color: #ffd166;
            word-wrap: break-word;
        }

        .hint {
            margin-top: 15px;
            font-size: 14px;
            opacity: 0.7;
        }
    </style>
</head>
<body>

<h1>Suffix to Scientific e Notation</h1>
<textarea id="input" placeholder="Type here... example: (43 Sp, 5.52 SxTg, 1 MiSxVtQa)"></textarea>
<div id="output"></div>
<div class="hint">Created for Inaccurate Skybox ARG game. To translate suffixes to usable text in the coordinate board.</div>

<script>
// Suffix Tears
let suffixes = {};

// Standard Numbers
const standard = ["k","M","B","T","Qd","Qn","Sx","Sp","Oc","No"];
standard.forEach((s,i)=> suffixes[s] = (i+1)*3);

// Decillions
const deci = ["De","UDe","DDe","TDe","QdDe","QnDe","SxDe","SpDe","OcDe","NoDe"];
deci.forEach((s,i)=> suffixes[s] = 33 + i*3);

// Vigintillions
const vig = ["Vt","UVt","DVt","TVt","QdVt","QnVt","SxVt","SpVt","OcVt","NoVt"];
vig.forEach((s,i)=> suffixes[s] = 63 + i*3);

// Trigintillions
const trig = ["Tg","UTg","DTg","TTg","QdTg","QnTg","SxTg","SpTg","OcTg","NoTg"];
trig.forEach((s,i)=> suffixes[s] = 93 + i*3);

// Quadragintillions
const quad = ["qg","Uqg","Dqg","Tqg","Qdqg","Qnqg","Sxqg","Spqg","Ocqg","Noqg"];
quad.forEach((s,i)=> suffixes[s] = 123 + i*3);

// Quinquagintillions
const quin = ["Qg","UQg","DQg","TQg","QdQg","QnQg","SxQg","SpQg","OcQg","NoQg"];
quin.forEach((s,i)=> suffixes[s] = 153 + i*3);

// Sexagintillions
const sex = ["sg","Usg","Dsg","Tsg","Qdsg","Qnsg","Sxsg","Spsg","Ocsg","Nosg"];
sex.forEach((s,i)=> suffixes[s] = 183 + i*3);

// Septuagintillions
const sept = ["Sg","USg","DSg","TSg","QdSg","QnSg","SxSg","SpSg","OcSg","NoSg"];
sept.forEach((s,i)=> suffixes[s] = 213 + i*3);

// Octogintillions
const oct = ["Og","UOg","DOg","TOg","QdOg","QnOg","SxOg","SpOg","OcOg","NoOg"];
oct.forEach((s,i)=> suffixes[s] = 243 + i*3);

// Nonagintillions
const non = ["Ng","UNg","DNg","TNg","QdNg","QnNg","SxNg","SpNg","OcNg","NoNg"];
non.forEach((s,i)=> suffixes[s] = 273 + i*3);

// Centillion Range (Ce - NoNgCe)
const tens = ["U","D","T","Qd","Qn","Sx","Sp","Oc","No"];
const centBase = ["Ce","DeCe","VtCe","TgCe","qgCe","QgCe","sgCe","SgCe","OgCe","NgCe"];
centBase.forEach((b,i)=>{
    tens.forEach((t,j)=>{
        suffixes[t+b] = 303 + i*30 + j*3; 
    });
});

// Parse and normalize
function normalize(num,power){
    if(num===0) return "0";
    while(Math.abs(num)>=10){ num/=10; power++; }
    while(Math.abs(num)<1){ num*=10; power--; }
    return num.toFixed(6).replace(/\.?0+$/,"")+"e"+power;
}

// Compound suffixes (ex. MiSxVtQa)
function parseCompoundSuffix(suffix){
    let tier2 = {Mi:3003, Mc:3000000}; // example tier2, can expand
    for(let key in tier2){
        if(suffix.startsWith(key)){
            let rest = suffix.slice(key.length);
            let baseExp = tier2[key];
            if(suffixes[rest]) return baseExp + suffixes[rest];
        }
    }
    return suffixes[suffix] || null;
}

// Convert text
function convert(text){
    return text.replace(/([-+]?\d*\.?\d+)\s*([A-Za-z]+)/g,(m,num,suf)=>{
        let exp = parseCompoundSuffix(suf);
        if(exp===null) return m;
        return normalize(parseFloat(num), exp);
    });
}
// Auto Update Text
document.getElementById("input").addEventListener("input",e=>{
    document.getElementById("output").innerText = convert(e.target.value);
});
</script>

</body>
</html>
