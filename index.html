<!DOCTYPE html>
<html>
<head>
    <title>Suffix to Scientific e Notation</title>

    <!-- Custom Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: "JetBrains Mono", monospace;
            background: linear-gradient(135deg,#1e1e2f,#2b2b40);
            color: white;
            padding: 40px;
            text-align: center;
        }

        h1 {
            font-size: 34px;
            margin-bottom: 25px;
        }

        textarea {
            width: 95%;
            height: 90px;
            font-size: 20px;
            padding: 15px;
            border-radius: 12px;
            border: none;
            background: #111;
            color: #00ffcc;
        }

        #output {
            margin-top: 25px;
            font-size: 24px;
            font-weight: bold;
            color: #ffd166;
            word-wrap: break-word;
        }

        .hint {
            margin-top: 15px;
            font-size: 14px;
            opacity: 0.7;
        }
    </style>
</head>

<body>

<h1>Suffix to Scientific e Notation</h1>

<textarea id="input" placeholder="Type here..."></textarea>

<div id="output"></div>

<div class="hint">
Mainly for Inaccurate Skybox ARG game Coordinates
</div>

<script>
/*
    Automatic suffix generator
    Every step = +3 exponent
*/

const baseNames = [
    "", "K", "M", "B", "T",
    "Qa","Qi","Sx","Sp","Oc","No",
    "De","UDe","DDe","TDe","QaDe","QnDe","SxDe","SpDe","OcDe","NoDe",
    "Vt","UVt","DVt","TVt","QaVt","QnVt","SxVt","SpVt","OcVt","NoVt",
    "Tg","UTg","DTg","TTg","QaTg","QnTg","SxTg","SpTg","OcTg","NoTg"
];

// generate automatically up to 10^303 (Centillion)
let suffixes = {};

for (let i = 0; i < 101; i++) {
    let power = i * 3;
    let name = baseNames[i] || ("e" + power); // fallback naming
    suffixes[name] = power;
}

function normalize(num, power) {
    if (num === 0) return "0";

    while (Math.abs(num) >= 10) {
        num /= 10;
        power++;
    }

    while (Math.abs(num) < 1) {
        num *= 10;
        power--;
    }

    return num.toFixed(6).replace(/\.?0+$/,"") + "e" + power;
}

function convert(text) {
    return text.replace(
        /([-+]?\d*\.?\d+)\s*([A-Za-z]+)/g,
        (match, number, suffix) => {
            if (!(suffix in suffixes)) return match;
            return normalize(parseFloat(number), suffixes[suffix]);
        }
    );
}

// auto convert while typing
document.getElementById("input").addEventListener("input", e => {
    document.getElementById("output").innerText = convert(e.target.value);
});
</script>

</body>
</html>
