<!DOCTYPE html>
<html>
<head>
    <title>Big Number Suffix Calculator</title>
    <style>
        body {
            font-family: Arial;
            background: linear-gradient(135deg,#e3f2fd,#f5f5f5);
            padding: 40px;
            text-align: center;
        }

        h1 {
            font-size: 32px;
        }

        textarea {
            width: 90%;
            height: 80px;
            font-size: 20px;
            padding: 10px;
            border-radius: 10px;
        }

        button {
            margin-top: 15px;
            font-size: 20px;
            padding: 10px 25px;
            border-radius: 10px;
            cursor: pointer;
        }

        #output {
            margin-top: 25px;
            font-size: 22px;
            font-weight: bold;
        }
    </style>
</head>
<body>

<h1>Suffix to Scientific e Notation Calculator</h1>

<textarea id="input" placeholder="Example: (59.8Sp, 0, -59.8Sp)"></textarea>
<br>
<button onclick="convert()">Convert</button>

<div id="output"></div>

<script>
const suffixes = {
    K:3, M:6, B:9, T:12,
    Qa:15, Qi:18, Sx:21, Sp:24, Oc:27, No:30,
    De:33, UDe:36, DDe:39, TDe:42, QaDe:45, QnDe:48,
    SxDe:51, SpDe:54, OcDe:57, NoDe:60,
    Vt:63, UVt:66, DVt:69, TVt:72, QaVt:75, QnVt:78,
    SxVt:81, SpVt:84, OcVt:87, NoVt:90,
    Tg:93, UTg:96, DTg:99, TTg:102, QaTg:105,
    QnTg:108, SxTg:111, SpTg:114, OcTg:117, NoTg:120
};

function normalize(num, power) {
    while (Math.abs(num) >= 10) {
        num /= 10;
        power++;
    }
    while (Math.abs(num) < 1 && num !== 0) {
        num *= 10;
        power--;
    }
    return num.toFixed(6).replace(/\.?0+$/,"") + "e" + power;
}

function convertOne(text) {
    const match = text.match(/([-+]?\d*\.?\d+)([A-Za-z]+)/);
    if (!match) return text;

    let number = parseFloat(match[1]);
    let suffix = match[2];

    if (!(suffix in suffixes)) return text;

    return normalize(number, suffixes[suffix]);
}

function convert() {
    let input = document.getElementById("input").value;
    let parts = input.split(/([,()])/);
    let result = parts.map(p => convertOne(p)).join("");
    document.getElementById("output").innerText = result;
}
</script>

</body>
</html>
